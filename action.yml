name: Publish GitHub Release Artifacts
description: |
  This action uploads GitHub Actions build artifacts to a GitHub Release,
  optionally creating and publishing the release (compatible with immutable releases).
author: Sierra Softworks
inputs:
  files:
    required: true
    description: |
      A list of files to publish, relative to the repository root.

      The files must be specified as a newline-delimited list of paths.

      ```yaml
      with:
        files: |
          - bin/release-windows
          - bin/release-linux
      ```

  token:
    required: false
    description: |
      The GitHub access token which will be used to upload release artifacts.

      Usually this will be `secrets.GITHUB_TOKEN`.

  overwrite:
    required: false
    default: 'false'
    description: |
      Overwrite existing artifacts with the same name for the specified release.

      Published immutable releases cannot have their artifacts changed.

  release_tag:
    required: false
    description: |
      The release tag which should receive the artifacts.

      By default this will be discovered based on the build environment, however
      you may specify it here if automatic discovery does not work for your usecase.

  bump:
    required: false
    description: |
      Determine the release tag by bumping the latest published release's version.

      One of `major`, `minor` or `patch` (e.g. `v1.2.3` + `minor` => `v1.3.0`).
      Cannot be combined with `release_tag`.

  create:
    required: false
    default: 'false'
    description: |
      Create a draft release if one doesn't exist for the release tag.

      An existing draft (e.g. from a failed run) has its target and notes refreshed.

  publish:
    required: false
    default: 'false'
    description: |
      Publish the release once all artifacts have been uploaded.

      Publishing creates the release tag, and locks the release if immutable releases are enabled.

  target:
    required: false
    description: |
      The commit which the release tag will point at when created (defaults to the current commit).

  notes-template:
    required: false
    description: |
      A path to a Markdown template used for the notes of created releases.

      Supports the `{{ tag }}`, `{{ version }}`, `{{ previous_tag }}`, `{{ repo }}`,
      `{{ sha }}` and `{{ changelog }}` placeholders, where `{{ changelog }}` is
      generated by GitHub (and configured by `.github/release.yml`).

      Defaults to just the generated changelog.

  vault-server:
    required: false
    description: |
      The Hashicorp Vault server which should be used to generate signatures.

  vault-token:
    required: false
    description: |
      The token used to access Hashicorp Vault for generation of signatures.

  vault-path:
    required: false
    description: |
      The path that the Vault transit engine is mounted at (defaults to 'transit')

  vault-signing-key:
    required: false
    description: |
      The name of the signing key to use for signature generation through Vault.

  vault-hash-algorithm:
    required: false
    description: |
      The hash algorithm which should be used to generate a unique hash for the content being signed.

outputs:
  tag:
    description: The tag of the release.
  release_id:
    description: The ID of the release.
  url:
    description: The URL of the release page.

runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: 'archive'
  color: 'gray-dark'
